<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; padding: 14px; font-family: system-ui, sans-serif;
         background: #1e1e1e; color: #eee; margin: 0; }
  h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: #fff; }
  label { display: block; font-size: 12px; margin: 12px 0 5px; color: #bbb; font-weight: 500; }
  select, button { width: 100%; padding: 7px 8px; background: #2a2a2a;
    color: #eee; border: 1px solid #444; border-radius: 5px;
    box-sizing: border-box; font-size: 13px; }
  select:focus { outline: none; border-color: #3a6df0; }
  button { cursor: pointer; background: #3a6df0; border: none; padding: 8px; font-weight: 500; }
  button:hover { background: #4a7dff; }
  button.sec { background: #444; }
  button.sec:hover { background: #555; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  .row button { flex: 1; }
  .status { font-size: 11px; color: #6c6; margin-top: 14px; min-height: 14px;
            text-align: center; word-break: break-word; }
  .sep { height: 1px; background: #333; margin: 14px 0 6px; }
</style>
</head>
<body>
  <h3>🎧 Audio Device Router</h3>

  <label>Наушники для этой вкладки</label>
  <select id="tabDevice"></select>
  <div class="row">
    <button id="applyTab">Применить</button>
    <button id="stopTab" class="sec">Стоп</button>
  </div>

  <div class="sep"></div>

  <label>Наушники для всех вкладок</label>
  <select id="globalDevice"></select>
  <div class="row">
    <button id="applyGlobal">Применить</button>
    <button id="stopGlobal" class="sec">Стоп</button>
  </div>

  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
